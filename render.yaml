services:
  - type: web
    name: vira-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./vira.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
    healthCheckPath: /health

# One service, one URL: nginx on the platform's assigned $PORT reverse-proxies
# / to the Next.js frontend and /api/* to the FastAPI backend, both running
# inside the same container. See Dockerfile + start.sh + nginx.conf.template.
#
# Notes:
# - Free-tier SQLite resets on redeploy and the service sleeps when idle
#   (cold start on first request). For anything persistent, add a Render
#   PostgreSQL instance and point DATABASE_URL at it -- no code changes needed.
# - Demo data seeds automatically on boot (see start.sh), so the deployed URL
#   is usable immediately with the printed demo logins.
